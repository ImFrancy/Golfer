function geo(ci,h){const par=C[ci].p[h],s=ci*18+h+3;let dl=par==3?0:[0,-1,1,0,1,-1][s%6];if(ci==0&&h==0)dl=1;/* Ca' Amata 1: dogleg a destra */
const b=dl||par==3?0:((s*7)%5-2)*14,sd=s%2?1:-1,tx=100-dl*24,g={x:100+(dl?dl*46:b),y:par==3?90:par==4?58:36},c=dl?{x:tx,y:par==5?140:165}:{x:100+b*2.2,y:190};
const m={par,dl,sd,t:{x:tx,y:312},g,c,k:dl?.5:0,len:par==3?120+(s%4)*20:par==4?330+(s%6)*15:470+(s%5)*15};m.a=dl?{x:tx,y:312-(312-c.y)*.9}:m.t;
const q=bez(.55,m),q1=bez(.45,m),q2=bez(.72,m);m.w={x:q.x+sd*62,y:q.y+(s%3)*8};
m.bk=[[q1.x-sd*38,q1.y,9,12],[q2.x+sd*38,q2.y,8,11],[g.x-24,g.y+14,9,6],[g.x+24,g.y+4,8,6]];
const pp=[];for(let t=0;t<=1;t+=.04)pp.push(bez(t,m));pp.push(g);
m.tr=[];for(let i=1;i<14;i++){const t=i/14,a=bez(t,m),z=bez(Math.min(1,t+.01),m),dx=z.x-a.x,dy=z.y-a.y,L=Math.hypot(dx,dy)||1;
for(const k of[-1,1])for(const r2 of[0,1]){if((s+i*(r2+2)+k+3)%3==0)continue;const off=40+r2*15+((s+i*3)%4)*4,x=a.x-k*dy/L*off,y=a.y+k*dx/L*off;
if(x<7||x>193||y<7||y>335||Math.hypot(x-g.x,y-g.y)<30||Math.hypot(x-m.t.x,y-m.t.y)<22||((x-m.w.x)/28)**2+((y-m.w.y)/36)**2<1||pp.some(p=>Math.hypot(x-p.x,y-p.y)<34))continue;m.tr.push([x,y,6+(s*i+r2)%3])}}return m}
const bez=(t,m)=>{if(t<m.k){const u=t/m.k;return{x:m.t.x+(m.a.x-m.t.x)*u,y:m.t.y+(m.a.y-m.t.y)*u}}const w=(t-m.k)/(1-m.k),u=1-w;return{x:u*u*m.a.x+2*u*w*m.c.x+w*w*m.g.x,y:u*u*m.a.y+2*u*w*m.c.y+w*w*m.g.y}};
const pth=m=>m.dl?`M${m.t.x} ${m.t.y}L${m.a.x} ${m.a.y}Q${m.c.x} ${m.c.y} ${m.g.x} ${m.g.y}`:`M${m.t.x} ${m.t.y}Q${m.c.x} ${m.c.y} ${m.g.x} ${m.g.y}`;
function classify(x,y,m){if(Math.hypot(x-m.g.x,y-m.g.y)<=19)return'G';if(((x-m.w.x)/22)**2+((y-m.w.y)/30)**2<=1)return'W';if(m.bk.some(k=>((x-k[0])/k[2])**2+((y-k[1])/k[3])**2<=1))return'B';
let d=1e9,p;for(let t=0;t<=1;t+=.02){const q=bez(t,m),e=Math.hypot(x-q.x,y-q.y);if(e<d){d=e;p=q}}return d<=24?'F':x<p.x?'L':'R'}
const RN={F:'Fairway',L:'Rough sinistra',R:'Rough destra',B:'Bunker',W:'Hazard acqua',G:'Green'};
function stats(r,ci){let fe=0,fh=0,ml=0,mr=0,bk=0,wt=0,ge=0,gh=0,hl=0;for(let h=0;h<18;h++){const sh=r[h]?.shots;if(!sh||!sh.length)continue;hl++;const par=C[ci].p[h],gi=sh.findIndex(s=>s.res=='G');
if(par>3){fe++;const k=sh[0].res;if(k=='F')fh++;else if(k=='L')ml++;else if(k=='R')mr++;else if(k=='B')bk++;else if(k=='W')wt++}
if(gi>=0||sh.length>=par-2){ge++;if(gi>=0&&gi+1<=par-2)gh++}}
const pc=(a,b)=>b?Math.round(a/b*100):0;return{fir:pc(fh,fe),gir:pc(gh,ge),L:pc(ml,fe),R:pc(mr,fe),B:pc(bk,fe),W:pc(wt,fe),fe,ge,fh,gh,holes:hl}}

<div class="c p-5 space-y-3">${S.err?`<div class="err" role="alert">${S.err}</div>`:''}${l?`
<label class="block"><span class="mut text-sm">Nome utente o email</span><input id="li" class="inp" autocomplete="username"></label>
<label class="block"><span class="mut text-sm">Password</span><input id="lp" type="password" class="inp" autocomplete="current-password"></label>
<button class="btn w-full" onclick="login()">Accedi</button>`:S.step==1?`
<label class="block"><span class="mut text-sm">Email</span><input id="se" type="email" class="inp" value="${esc(S.tmp?.email||'')}"></label>
<label class="block"><span class="mut text-sm">Nome utente</span><input id="su" class="inp" value="${esc(S.tmp?.username||'')}"></label>
<label class="block"><span class="mut text-sm">Password (almeno 6 caratteri)</span><input id="sp" type="password" class="inp"></label>
<label class="block"><span class="mut text-sm">Conferma password</span><input id="sc" type="password" class="inp"></label>
<button class="btn w-full" onclick="signup1()">Invia codice di verifica</button>`:`
<div class="p-3 rounded-xl" style="background:var(--acc)">Modalità demo: nessuna email viene inviata. Il tuo codice è <b class="text-xl">${S.tmp.code}</b></div>
<label class="block"><span class="mut text-sm">Inserisci il codice a 6 cifre</span><input id="sv" inputmode="numeric" maxlength="6" class="inp text-2xl tracking-widest"></label>
<button class="btn w-full" onclick="signup2()">Verifica e crea account</button><button class="btn o w-full" onclick="S.step=1;S.err='';R()">Indietro</button>`}</div>`}
function login(){const i=$('#li').value.trim().toLowerCase(),p=$('#lp').value,u=users().find(x=>x.username.toLowerCase()==i||x.email.toLowerCase()==i);
if(!u||u.pw!==hash(p)){S.err='Nome utente/email o password non corretti.';return R()}U=init(u);st.set('gf_ses',u.username);S.err='';go('home')}
function signup1(){const e=$('#se').value.trim(),n=$('#su').value.trim(),p=$('#sp').value,c=$('#sc').value;S.tmp={email:e,username:n};
if(!/^\S+@\S+\.\S+$/.test(e))S.err='Inserisci un indirizzo email valido.';
else if(n.length<3||!/^[\w.-]+$/.test(n))S.err='Il nome utente richiede 3+ caratteri: lettere, numeri, punti o trattini.';
else if(users().some(u=>u.username.toLowerCase()==n.toLowerCase()))S.err='Nome utente già in uso. Scegline un altro.';
else if(users().some(u=>u.email.toLowerCase()==e.toLowerCase()))S.err='Esiste già un account con questa email.';
else if(p.length<6)S.err='La password deve avere almeno 6 caratteri.';
else if(p!==c)S.err='Le password non coincidono.';
else{S.err='';S.tmp.pw=hash(p);S.tmp.code=String(Math.floor(100000+Math.random()*900000));S.step=2}R()}
function signup2(){if($('#sv').value.trim()!==S.tmp.code){S.err='Codice errato. Controlla il codice sopra e riprova.';return R()}
if(users().some(u=>u.username.toLowerCase()==S.tmp.username.toLowerCase())){S.err='Nome utente già in uso.';S.step=1;return R()}
U=init({email:S.tmp.email,username:S.tmp.username,pw:S.tmp.pw,hcp:null,rounds:[],custom:[]});save(U);st.set('gf_ses',U.username);S.tmp=null;go('profile')}
function logout(){st.del('gf_ses');U=null;S.g=null;S.rep=null;S.auth='login';R()}

/* ---------- dashboard ---------- */
const hc=()=>U.hcp==null?'–':String(U.hcp).replace('.',',');
function perf(){const rs=U.rounds.filter(r=>(r.s.holes||0)>=9),n=rs.length,fe=rs.reduce((a,r)=>a+r.s.fe,0),ge=rs.reduce((a,r)=>a+r.s.ge,0),hit=rs.reduce((a,r)=>a+(r.s.fh||0)+(r.s.gh||0),0);
const prec=fe+ge?Math.round(hit/(fe+ge)*100):null,idx=r=>(r.s.fir+r.s.gir)/2,last=rs.slice(-3);let cons=null;
if(last.length>=2){const v=last.map(idx),mu=v.reduce((a,b)=>a+b)/v.length,sd=Math.sqrt(v.reduce((a,b)=>a+(b-mu)**2,0)/v.length);cons=Math.round(Math.max(0,100-2*sd))}
const on=n>=1&&fe+ge>=9,score=on?Math.round(cons==null?prec:.6*prec+.4*cons):null;
let delta=null;if(rs.length>=4){const old=rs.slice(0,-3),a=x=>x.reduce((s,r)=>s+idx(r),0)/x.length;delta=Math.round(a(last)-a(old))}
return{n,fe,ge,prec,cons,on,score,delta}}
function pcard(){const p=perf(),sc=p.score,drv=U.drv,K=2*Math.PI*44;
return`<div class="pcard p-5"><div class="flex justify-between items-start gap-2"><div><div class="text-xl font-extrabold">Indice di performance</div><div class="mut text-sm">La sintesi del tuo gioco</div></div><span class="pill">${p.on?'Attivo':'In attesa dei dati'}</span></div>
<div class="flex flex-wrap gap-5 items-center mt-4"><svg viewBox="0 0 100 100" class="w-28 h-28" role="img" aria-label="Indice ${sc??'non disponibile'} su 100"><circle cx="50" cy="50" r="44" fill="none" stroke="#2b3a34" stroke-width="9"/><circle cx="50" cy="50" r="44" fill="none" stroke="#10b981" stroke-width="9" stroke-linecap="round" stroke-dasharray="${K*(sc||0)/100} ${K}" transform="rotate(-90 50 50)" style="transition:stroke-dasharray .8s"/><text x="50" y="52" text-anchor="middle" font-size="24" font-weight="800" fill="#e9f0ec">${sc??'—'}</text><text x="50" y="67" text-anchor="middle" font-size="9" font-weight="700" fill="#10b981">/100</text></svg>
<div class="flex-1 min-w-[12rem] space-y-3"><div><div class="flex justify-between text-sm font-semibold"><span>Consistenza</span><b>${p.cons==null?'—':p.cons}</b></div><div class="bar mt-1"><i style="width:${p.cons||0}%"></i></div><div class="mut text-xs mt-1">${Math.min(p.n,3)}/3 round completi</div></div>
<div><div class="flex justify-between text-sm font-semibold"><span>Precisione</span><b>${p.prec==null?'—':p.prec}</b></div><div class="bar mt-1"><i style="width:${p.prec||0}%"></i></div><div class="mut text-xs mt-1">${p.fe} fairway · ${p.ge} green</div></div></div></div>
<div class="grid grid-cols-5 gap-3 mt-4"><div class="tile p-3 col-span-3"><div class="mut text-xs">Distanza media driver</div><div class="text-xl font-extrabold">${drv?drv+' m':'—'}</div><div class="mut text-xs">${drv?'Dal tuo profilo':'Nessun dato'}</div></div>
<div class="tile p-3 col-span-2"><div class="mut text-xs">Periodo precedente</div><div class="font-extrabold" style="color:var(--g)">${p.delta==null?'Dati insufficienti':(p.delta>0?'+':'')+p.delta+' pt'}</div></div></div>
<p class="mut text-xs mt-3">${p.on?'Punteggio calcolato sui tuoi round con almeno 9 buche registrate.':'Inserisci round completi (almeno 9 buche) e almeno 9 rilevazioni di fairway o green per attivare il punteggio.'}</p></div>`}
function disp(){const fe=U.rounds.reduce((a,r)=>a+(r.s.fe||0),0),A=k=>fe?Math.round(U.rounds.reduce((a,r)=>a+(r.s[k]||0)*(r.s.fe||0)/100,0)/fe):0;
return`<div class="c p-5"><div class="flex justify-between items-baseline"><b>Dispersione tee shot</b><span class="mut text-sm">${fe} tee shot registrati</span></div>${fan({fir:A('fir'),L:A('L'),R:A('R'),B:A('B'),W:A('W')},tier())}</div>`}
function home(){const t=tier(),r=U.rounds[U.rounds.length-1];return`
<div class="c p-6 h flex justify-between items-center" onclick="go('profile')" style="cursor:pointer"><div><div class="mut text-sm">Handicap ufficiale</div><div class="text-6xl font-extrabold leading-none mt-1">${hc()}</div></div>
<div class="text-right"><div class="mut text-sm">Livello</div><div class="text-2xl font-extrabold" style="color:var(--g)">${t||'Da definire'}</div></div></div>
${pcard()}

${trend()}
<div class="grid grid-cols-2 gap-3">${[['game','⛳','Gioca un round'],['train','🏌️','Allenati'],['cal','📅','Calendario gare'],['coach','🤖','AI Coach']].map(a=>`<button class="c h p-4 text-left" onclick="go('${a[0]}')"><div class="text-2xl">${a[1]}</div><div class="font-bold mt-1">${a[2]}</div></button>`).join('')}</div>
<div class="c p-5"><div class="font-bold mb-2">Ultimo round</div>${r?`<div class="mut text-sm mb-2">${esc(r.course)} · ${r.date}</div>${bars([['GIR',r.s.gir],['FIR',r.s.fir]])}`:'<p class="mut">Nessun round ancora. Avvia la modalità Gioco per registrare il primo.</p>'}</div>`}
const bars=a=>a.map(x=>`<div class="mb-3"><div class="flex justify-between"><span>${x[0]}</span><b class="text-lg">${x[1]}%</b></div><div class="bar"><i style="width:${x[1]}%"></i></div></div>`).join('');

<div class="space-y-3">${U.custom.length?U.custom.map((c,i)=>`<div class="c p-4"><div class="flex justify-between gap-2"><div><div class="font-bold">${esc(c.name)}</div><div class="mut text-sm">${WN[c.area]}${c.min?' · '+c.min+' min':''}</div></div><div class="flex gap-3 text-sm font-bold"><button onclick="S.ed=${i};S.err='';R();scrollTo(0,0)">Modifica</button><button style="color:#f87171" onclick="delW(${i})">${S.cf=='w'+i?'Conferma?':'Elimina'}</button></div></div><ol class="list-decimal pl-5 mt-2">${c.drills.map(d=>`<li>${esc(d)}</li>`).join('')}</ol>${c.notes?`<p class="mut text-sm mt-2">${esc(c.notes)}</p>`:''}</div>`).join(''):'<p class="mut">Non hai ancora allenamenti personalizzati. Creane uno qui sopra.</p>'}</div>`}

<div class="flex gap-2"><button class="btn o flex-1" onclick="dictate()">${S.dict?'⏹ Ferma dettato':'🎤 Detta nota'}</button><button class="btn flex-1" onclick="saveN()">Salva nota</button></div>

let REC=null;
function dictate(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;S.nt=$('#nt')?.value??S.nt;
if(!SR){S.err2='Il dettato vocale non è supportato da questo browser: scrivi la nota.';return R()}
if(REC){REC.stop();return}S.err2='';REC=new SR();REC.lang='it-IT';REC.continuous=true;REC.interimResults=false;
REC.onresult=e=>{const t=$('#nt');for(let i=e.resultIndex;i<e.results.length;i++)if(e.results[i].isFinal){t.value+=(t.value?' ':'')+e.results[i][0].transcript.trim();S.nt=t.value}};
REC.onerror=e=>{S.err2=e.error=='not-allowed'||e.error=='service-not-allowed'?'Microfono non consentito in questa pagina: scrivi la nota.':'Dettato vocale non riuscito: scrivi la nota.'};
REC.onend=()=>{REC=null;S.dict=false;R()};try{REC.start();S.dict=true}catch(e){REC=null;S.err2='Dettato vocale non disponibile: scrivi la nota.'}R()}
function saveN(){const t=($('#nt').value||'').trim();if(!t){S.err2='Scrivi o detta una nota prima di salvare.';return R()}if(REC)REC.stop();U.notes.unshift({d:new Date().toLocaleDateString('it-IT'),t});S.nt='';S.err2='';save(U);R()}
function setH(){const v=parseFloat($('#hcp').value.replace(',','.')),d=$('#drv').value;if(isNaN(v)||v<-20||v>54){S.err='Inserisci un HCP tra -20 e 54.';return R()}
U.hcp=Math.round(v*10)/10;U.drv=d?Math.max(50,Math.min(400,parseInt(d))):null;save(U);S.err='';go('home')}

/* ---------- modalità gioco ---------- */
const leaveOk=()=>{const r=S.g.r[S.g.h];return!r||!r.shots.some(s=>s.res=='G')||r.skip||r.holed};
function nav(i){if(i!=S.g.h&&!leaveOk()){S.msg='Completa la buca: tocca il green per ogni putt e la buca per finire (oppure salta la puttata).';return R()}S.g.h=i;R()}
function game(){if(S.rep)return report(S.rep);const msg=S.msg;S.msg='';
if(!S.g)return`<h2 class="text-3xl font-extrabold">Gioca</h2><div class="c p-5 space-y-3"><label class="block"><span class="mut text-sm">Campo da golf</span><select class="inp" onchange="S.sel=+this.value">${['Veneto','Pozzolengo (Garda)','Schema'].map(r=>`<optgroup label="${r=='Pozzolengo (Garda)'?'Lago di Garda':r=='Schema'?'Altro':'Veneto'}">${C.map((c,i)=>c.r==r?`<option value="${i}" ${i==S.sel?'selected':''}>${c.n}</option>`:'').join('')}</optgroup>`).join('')}</select></label>
<p class="mut text-xs">Mappe dall'alto in stile satellitare stilizzato (non immagini reali). Ca' Amata buca 1 è un dogleg a destra; le altre buche hanno forme generate, non ancora ricalcate sui rilievi reali.</p><button class="btn w-full" onclick="S.g={ci:S.sel,h:0,r:{}};R()">Inizia round</button></div>`;
const G=S.g,h=G.h,m=geo(G.ci,h),r=G.r[h]||{shots:[]},sh=r.shots,n=sh.length+1,gi=sh.findIndex(s=>s.res=='G'),lim=m.par-2,no=m.par>3&&n==1;
const rule=m.par==3?'Par 3: green al colpo 1 = GIR.':m.par==4?'Par 4: il colpo 1 non raggiunge il green. Il green si registra dal colpo 2 (GIR = green al colpo 2).':'Par 5: il colpo 1 non raggiunge il green. Il green si registra al colpo 2 o 3 (GIR = green entro il colpo 3).';
const col={G:'#fff',F:'#f2b705',W:'#3b8fd1',B:'#ecd9a0'};
const pts=sh.filter(s=>s.x!=null),line=pts.length?`<polyline points="${m.t.x},${m.t.y} ${pts.map(s=>s.x+','+s.y).join(' ')}" fill="none" stroke="#fff" stroke-width="1.2" stroke-dasharray="3 3" opacity=".85"/>`:'';
const dots=sh.map((s,i)=>s.x==null?'':`<circle cx="${s.x}" cy="${s.y}" r="7" fill="${col[s.res]||'#e67e22'}" stroke="#000" stroke-width="1.5"/><text x="${s.x}" y="${s.y+3.5}" font-size="10" font-weight="700" text-anchor="middle">${i+1}</text>`).join('');
const FP=pth(m),map=`<svg id="hole" viewBox="0 0 200 340" class="w-full rounded-2xl" style="width:min(100%,calc(66vh*.588));aspect-ratio:200/340;display:block;margin:auto;touch-action:manipulation;cursor:crosshair" onclick="tap(event)" role="img" aria-label="Buca ${h+1} vista dall'alto">
<defs><filter id="nz" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" seed="${h+3}"/><feColorMatrix values="0 0 0 0 .08 0 0 0 0 .25 0 0 0 0 .1 0 0 0 .6 0"/></filter>
<radialGradient id="gg" cx=".4" cy=".35"><stop offset="0" stop-color="#c3f097"/><stop offset="1" stop-color="#78c05f"/></radialGradient><linearGradient id="wt" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#63bdea"/><stop offset="1" stop-color="#2a76b5"/></linearGradient></defs>

function addShot(res,x,y){const G=S.g,m=geo(G.ci,G.h),r=G.r[G.h]||{shots:[]},n=r.shots.length+1;S.msg='';

const fm=n=>String(Math.round(n*10)/10).replace('.',',');
function detail(rd){const o={hl:0,cn:0,st:0,pr:0,pu:0,nh:0,p1:0,p3:0,pg:0,ng:0,sa:0,sv:0,bk:0,wt:0,d:[0,0,0,0,0],ps:{3:[0,0],4:[0,0],5:[0,0]},g3:[0,0],g45:[0,0]};
for(let h=0;h<18;h++){const x=rd.r&&rd.r[h],sh=x&&x.shots;if(!sh||!sh.length)continue;o.hl++;const par=C[rd.ci].p[h],gi=sh.findIndex(s=>s.res=='G'),gir=gi>=0&&gi+1<=par-2;
sh.forEach(s=>{if(s.res=='B')o.bk++;if(s.res=='W')o.wt++});
if(gi>=0||sh.length>=par-2){const t=par==3?o.g3:o.g45;t[1]++;if(gir)t[0]++}
if(gi>=0&&x.holed){const pl=(x.pl||[]).length,sc=gi+1+pl,df=sc-par;o.cn++;o.st+=sc;o.pr+=par;o.pu+=pl;o.nh++;if(pl==1)o.p1++;if(pl>=3)o.p3++;if(gir){o.pg+=pl;o.ng++}else{o.sa++;if(sc<=par)o.sv++}
o.d[df<=-2?0:df==-1?1:df==0?2:df==1?3:4]++;o.ps[par][0]+=sc;o.ps[par][1]++}}return o}
function agg(rds){const a=detail({r:{},ci:0});for(const rd of rds){const o=detail(rd);for(const k in a){if(Array.isArray(a[k]))a[k]=a[k].map((v,i)=>v+o[k][i]);else if(typeof a[k]=='object'){for(const p in a[k])a[k][p]=a[k][p].map((v,i)=>v+o[k][p][i])}else a[k]+=o[k]}}return a}

const CG={'Driver':'D','Ferro 5':'I','Ferro 7':'I','Ferro 9':'I','Pitching wedge':'W','Wedge / Approccio':'W'};
const FL={D:[[`Transizione dall'alto verso il basso che crea uno slice.`,`Parti dalle anche verso il bersaglio e lascia cadere il bastone dietro di te.`],[`Palla troppo indietro nella stance: lancio basso.`,`Posizionala in linea col tallone avanti e inclina la schiena lontano dal bersaglio.`],[`Estensione precoce: le anche vanno verso la palla.`,`Tieni i glutei contro un muro o una sedia durante il backswing.`],[`Peso rimasto sul piede dietro all'impatto.`,`Finisci con la cintura verso il bersaglio e il peso sulla gamba avanti.`]],
I:[[`Punto più basso dietro la palla: colpi grassi.`,`Metti un tee 5 cm davanti alla palla e sfiorala dopo l'impatto.`],[`Polsi che “aiutano” la palla a salire.`,`Polso avanti piatto con l'asta inclinata verso il bersaglio all'impatto.`],[`Faccia aperta in cima al backswing.`,`Controlla che il polso avanti sia piatto o leggermente flesso.`],[`Presa troppo stretta che blocca lo swing.`,`Pressione 4 su 10: lascia oscillare il bastone.`]],
W:[[`Rallentamento in impatto: colpi grassi o sottili.`,`Backswing più lungo e finale fluido che accelera.`],[`Mani dietro la palla: loft e distanza imprevedibili.`,`Mantieni l'asta inclinata verso il bersaglio all'impatto.`],[`Peso troppo indietro: poco controllo.`,`60% del peso sul piede avanti e mantienilo.`],[`Lunghezza dello swing diversa a ogni colpo.`,`Usa le lunghezze a orologio (7:30, 9:00, 10:30) e annota il carry.`]]};
const TG={Avanzato:{D:'Obiettivo: dispersione sotto i 25 m e curva controllata a richiesta.',I:'Obiettivo: carry costante entro 5 m e contatto al centro.',W:'Obiettivo: 3 distanze a orologio entro 2 m.'},Intermedio:{D:'Obiettivo: 7 fairway su 14 con un errore sempre dallo stesso lato.',I:'Obiettivo: contatto palla-terra costante in 8 colpi su 10.',W:'Obiettivo: green in regolazione dai 50 m con due distanze fisse.'},Base:{D:'Obiettivo: colpire la palla in aria e restare in campo.',I:'Obiettivo: contatto pulito in 6 colpi su 10.',W:'Obiettivo: portare la palla sul green da 30 m.'}};
function vid(k,i){const f=i.files[0];if(!f)return;if(CO.v[k]?.url)URL.revokeObjectURL(CO.v[k].url);CO.v[k]={name:f.name,size:f.size,url:URL.createObjectURL(f)};CO.res=null;S.err='';R()}
function sample(){CO.v={side:{name:'esempio-laterale.mp4',size:1000},front:{name:'esempio-frontale.mp4',size:2000}};CO.res=null;S.err='';R()}
async function frames(url,n=20){const v=document.createElement('video');v.muted=true;v.playsInline=true;v.src=url;await new Promise((ok,ko)=>{v.onloadedmetadata=ok;v.onerror=ko});const d=v.duration;if(!isFinite(d)||d<=0)throw 0;
const c=document.createElement('canvas');c.width=c.height=48;const x=c.getContext('2d',{willReadFrequently:true});let prev=null,out=[];
for(let i=0;i<n;i++){v.currentTime=d*(i+.5)/n;await new Promise(r=>v.onseeked=r);x.drawImage(v,0,0,48,48);const a=x.getImageData(0,0,48,48).data,g=[];for(let j=0;j<a.length;j+=4)g.push((a[j]+a[j+1]+a[j+2])/3);
if(prev){let s=0,cx=0,w=0;for(let j=0;j<g.length;j++){const df=Math.abs(g[j]-prev[j]);if(df>25){s+=df;cx+=(j%48)*df;w+=df}}out.push({e:s,cx:w?cx/w:null})}prev=g}return out}
const tempo=o=>{const e=o.map(p=>p.e),mx=Math.max(...e);if(!mx)return null;const a=e.findIndex(v=>v>.25*mx),b=e.length-1-[...e].reverse().findIndex(v=>v>.25*mx),pk=e.indexOf(mx);return(pk-a+1)/Math.max(1,b-pk+1)};
const sway=o=>{const v=o.map(p=>p.cx).filter(x=>x!=null);if(v.length<4)return null;const mu=v.reduce((a,b)=>a+b)/v.length;return Math.sqrt(v.reduce((a,b)=>a+(b-mu)**2,0)/v.length)/48};
async function analyse(){const{side,front}=CO.v;if(!side||!front){S.err='Carica entrambi i video: laterale e frontale.';return R()}S.err='';S.busy=true;R();
let tp=null,sw=null;try{if(side.url)tp=tempo(await frames(side.url))}catch(e){}try{if(front.url)sw=sway(await frames(front.url))}catch(e){}
const t=tier(),sev=TI[t].sev,k=CO.club;let hs=0;for(const c of k+t+side.name+side.size+front.name+front.size)hs=(hs*31+c.charCodeAt(0))>>>0;
const rnd=i=>{let x=(hs+i*1013904223)>>>0;x=Math.imul(x^(x>>>15),2246822519)>>>0;x=(x^(x>>>13))>>>0;return x%1000/1000},cl=v=>Math.max(0,Math.min(10,Math.round(v*2)/2));
const ts=tp==null?null:10-Math.min(10,Math.abs(tp-3)*1.5),ss=sw==null?null:10-Math.min(10,sw*60),b=i=>4.5+rnd(i)*4.5+sev;
const PH=[['Setup',cl(b(0))],['Backswing',cl(b(1))],['Transizione',cl(ts==null?b(2):(ts+sev+b(2))/2)],['Impatto',cl(ss==null?b(3):(ss+sev+b(3))/2)],['Finale',cl(ss==null?b(4):(ss+sev+b(4))/2)]];
const overall=Math.round(PH.reduce((a,p)=>a+p[1],0)/5*10)/10,weak=PH.slice().sort((a,b)=>a[1]-b[1])[0][0];
const faults=FL[CG[k]].map((f,i)=>[rnd(10+i),f]).sort((a,b)=>a[0]-b[0]).slice(0,3).map(x=>x[1]);
CO.res={overall,PH,faults,t,k,weak,tp,sw};S.busy=false;R()}
function coach(){const t=tier(),h=`<h2 class="text-3xl font-extrabold">AI Coach</h2>`;
if(!t)return h+`<div class="c p-5"><p>Inserisci il tuo HCP nel profilo: il coach adatta l'analisi al tuo livello.</p><button class="btn mt-3" onclick="go('profile')">Inserisci HCP</button></div>`;
const T=TI[t],r=CO.res,up=(k,l)=>{const f=CO.v[k];return`<div class="c p-3"><div class="font-bold mb-2">${l}</div>${f?.url?`<video src="${f.url}" controls playsinline class="w-full rounded-xl mb-2" style="max-height:220px"></video>`:''}${f?`<div class="text-sm mb-2">✓ ${esc(f.name)}</div>`:''}<label class="btn o w-full block cursor-pointer focus-within:ring-2">${f?'Sostituisci video':'Carica video'}<input type="file" accept="video/*" class="sr-only" onchange="vid('${k}',this)"></label></div>`};
return h+`<div class="pcard p-5"><div class="text-2xl font-extrabold">Livello ${t}</div><div class="sub text-sm">${T.n}</div></div>
<div class="grid sm:grid-cols-2 gap-3">${up('side','Vista laterale (da dietro)')}${up('front','Vista frontale')}</div>
<button class="chip" onclick="sample()">Usa clip di esempio</button>
<label class="block"><span class="mut text-sm">Bastone usato</span><select class="inp" onchange="CO.club=this.value;CO.res=null;R()">${Object.keys(CG).map(c=>`<option ${c==CO.club?'selected':''}>${c}</option>`).join('')}</select></label>
${S.err?`<div class="err" role="alert">${S.err}</div>`:''}<button class="btn w-full" ${S.busy?'disabled':''} onclick="analyse()">${S.busy?'Analisi in corso…':'Analizza lo swing'}</button>
${r?`<div class="c p-5 zoomin"><div class="text-center"><div class="mut text-sm">Punteggio swing · livello ${r.t} · ${r.k}</div><div class="text-6xl font-extrabold" style="color:var(--g)">${r.overall}<span class="text-2xl mut">/10</span></div></div><div class="mt-3">${r.PH.map(p=>`<div class="mb-2"><div class="flex justify-between text-sm"><span>${p[0]}</span><b>${p[1]}</b></div><div class="bar"><i style="width:${p[1]*10}%"></i></div></div>`).join('')}</div>
${r.tp!=null||r.sw!=null?`<div class="font-bold mt-3">Misure dai tuoi video</div><ul class="list-disc pl-5 mut">${r.tp!=null?`<li>Ritmo stimato (salita:discesa) ${r.tp.toFixed(1)}:1, ideale circa 3:1.</li>`:''}${r.sw!=null?`<li>Oscillazione del corpo nel video frontale: ${r.sw<.08?'contenuta':r.sw<.15?'media':'ampia'}.</li>`:''}</ul>`:''}
<div class="font-bold mt-3">Errori principali con ${r.k}</div><ul class="space-y-2 mt-1">${r.faults.map(f=>`<li><b>${f[0]}</b><br><span class="mut">Correzione: ${f[1]}</span></li>`).join('')}</ul>
<div class="font-bold mt-3">Da controllare nei video</div><ul class="list-disc pl-5 mut"><li>Laterale: angolo della schiena e piano del bastone nella fase ${r.weak.toLowerCase()}.</li><li>Frontale: testa stabile e trasferimento del peso sul lato avanti.</li></ul>
<div class="font-bold mt-3">Consigli per il livello ${r.t}</div><ul class="list-disc pl-5 mut"><li>${TG[r.t][CG[r.k]]}</li>${TI[r.t].tips.map(x=>`<li>${x}</li>`).join('')}</ul>
<p class="text-xs mut mt-3">Analisi indicativa: il ritmo e l'oscillazione sono stimati dal movimento nel video, non è una vera analisi biomeccanica. Il resto del punteggio è un'indicazione per livello e bastone.</p></div>`:''}`}

/* ---------- struttura ---------- */
function R(){const a=$('#app');if(!U){a.innerHTML=authView();return}
const T=[['home','🏠','Home'],['train','🏌️','Allenati'],['game','⛳','Gioca'],['cal','📅','Gare'],['coach','🤖','Coach'],['profile','👤','Profilo']];
const v={home,train,cal,game,coach,profile}[S.tab](),fx=S.fx;S.fx=false;
a.innerHTML=`<header class="flex justify-between items-center mb-4"><div class="text-2xl font-extrabold" style="color:var(--g)">Golfer</div><button class="chip" onclick="go('profile')">${tier()||'Livello'} · HCP <b>${hc()}</b></button></header><main class="${fx?'fx':''} space-y-4">${v}</main><nav class="nav flex" aria-label="Principale">${T.map(t=>`<button class="${S.tab==t[0]?'on':''}" onclick="go('${t[0]}')"><span>${t[1]}</span>${t[2]}</button>`).join('')}</nav>`}
R();
</script></body></html>
